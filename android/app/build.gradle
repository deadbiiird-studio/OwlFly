apply plugin: 'com.android.application'

// These values must come from the build environment, not source control.
def owlflyReleaseSigning = [
    storeFile: System.getenv('OWLFLY_KEYSTORE_FILE'),
    storePassword: System.getenv('OWLFLY_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('OWLFLY_KEY_ALIAS'),
    keyPassword: System.getenv('OWLFLY_KEY_PASSWORD')
]
def hasOwlFlyReleaseSigning = owlflyReleaseSigning.values().every { it != null && !it.trim().isEmpty() }

// Fail closed when a signed release is explicitly requested without credentials.
// Normal Gradle sync and debug builds stay available.
if (gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains('release') }
        && !hasOwlFlyReleaseSigning) {
    throw new GradleException('OwlFly release signing requires OWLFLY_KEYSTORE_FILE, OWLFLY_KEYSTORE_PASSWORD, OWLFLY_KEY_ALIAS, and OWLFLY_KEY_PASSWORD.')
}

android {
    namespace "com.owlfly.game"
    compileSdk 35
    buildToolsVersion "36.1.0"

    // Release signing uses local environment variables; never commit credentials.
    // Debug builds and Gradle sync do not require a keystore.
    signingConfigs {
        release {
            if (hasOwlFlyReleaseSigning) {
                storeFile file(owlflyReleaseSigning.storeFile)
                storePassword owlflyReleaseSigning.storePassword
                keyAlias owlflyReleaseSigning.keyAlias
                keyPassword owlflyReleaseSigning.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.owlfly.game"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            if (hasOwlFlyReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}