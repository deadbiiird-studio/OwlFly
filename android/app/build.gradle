apply plugin: 'com.android.application'

android {
    namespace "com.owlfly.game"
    compileSdk 35
    buildToolsVersion "36.1.0"

    // Credentials are supplied only by the local environment, never committed.
    // Missing values leave debug builds usable while release signing remains gated.
    def releaseStorePath = System.getenv('OWLFLY_RELEASE_STORE_FILE')
    def releaseStorePassword = System.getenv('OWLFLY_RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = System.getenv('OWLFLY_RELEASE_KEY_ALIAS')
    def releaseKeyPassword = System.getenv('OWLFLY_RELEASE_KEY_PASSWORD')
    def releaseSigningReady = [releaseStorePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.owlfly.game"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
// Prevent accidentally producing an unsigned release when the upload key is not configured.
gradle.taskGraph.whenReady { graph ->
    def requestedRelease = graph.allTasks.any { task ->
        task.project == project && task.name ==~ /(?i)(assemble|bundle|package)Release/
    }
    if (requestedRelease) {
        if (!android.buildTypes.release.signingConfig) {
            throw new GradleException('OwlFly release signing is not configured. Set OWLFLY_RELEASE_STORE_FILE, OWLFLY_RELEASE_STORE_PASSWORD, OWLFLY_RELEASE_KEY_ALIAS, and OWLFLY_RELEASE_KEY_PASSWORD. See README.md.')
        }
        if (!file(System.getenv('OWLFLY_RELEASE_STORE_FILE')).isFile()) {
            throw new GradleException('OwlFly release keystore file not found. Check OWLFLY_RELEASE_STORE_FILE.')
        }
    }
}
