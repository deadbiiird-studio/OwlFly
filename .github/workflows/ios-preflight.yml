name: OwlFly iOS and TestFlight

on:
  pull_request:
    paths: &ios_paths
      - '.github/workflows/ios-preflight.yml'
      - 'ios/**'
      - 'src/**'
      - 'web/**'
      - 'tooling/**'
      - 'tests/**'
      - 'package*.json'
      - 'capacitor.config.json'
  push:
    branches: [main]
    paths: *ios_paths
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: Sign and upload this build to App Store Connect for TestFlight
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: iPhone simulator and device archive
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and sync the bundled game
        run: bash ios/ci/prepare.sh
      - name: Run shared gameplay tests
        run: npm test
      - name: Compile and open the game on an iPhone simulator
        run: bash ios/ci/simulator.sh
      - name: Archive the Release build for an iPhone
        run: |
          xcodebuild -quiet -project ios/App/App.xcodeproj -scheme App \
            -configuration Release -destination 'generic/platform=iOS' \
            -onlyUsePackageVersionsFromResolvedFile \
            -archivePath "$RUNNER_TEMP/OwlFly.xcarchive" CODE_SIGNING_ALLOWED=NO archive
          bash ios/ci/check-app.sh "$RUNNER_TEMP/OwlFly.xcarchive/Products/Applications/App.app"
      - name: Keep the simulator screen
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: owlfly-iphone-screen-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owlfly-iphone.png
          if-no-files-found: ignore
          retention-days: 14

  testflight:
    name: Sign, verify and upload to TestFlight
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.upload_to_testflight }}
    environment: ios-testflight
    runs-on: macos-26
    timeout-minutes: 35
    concurrency:
      group: owlfly-ios-testflight-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build and sync the same revision
        run: bash ios/ci/prepare.sh
      - name: Archive, export and verify the signed IPA
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: bash ios/ci/sign.sh
      - name: Upload the verified IPA to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: bash ios/ci/upload.sh
