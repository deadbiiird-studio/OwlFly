name: Deploy OwlFly to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "tooling/build.mjs"
      - "tooling/eval/**"
      - "tests/**"
      - "package.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test source
        run: npm run test

      - name: Build production website from source
        run: npm run build

      # Android/Capacitor retains web/index.html as the game.
      # Only the GitHub Pages upload is transformed into a homepage + player.
      - name: Prepare public homepage without changing Android entrypoint
        run: |
          test -s web/home.html
          test -s web/home.css
          cp web/index.html web/play.html
          cp web/home.html web/index.html

      - name: Verify static website entrypoint
        run: |
          test -s web/index.html
          test -s web/game.js
          test -s web/style.css
          test -s web/home.css
          test -s web/robots.txt
          test -s web/sitemap.xml
          grep -q 'href="./play.html"' web/index.html
          grep -q 'id="game"' web/play.html
          test "$(cat web/CNAME)" = "owlfly.app"
          test -s web/.well-known/assetlinks.json

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
