name: OwlFly Android bundle (manual, no Play upload)

on:
  pull_request:
    paths:
      - ".github/workflows/android-bundle.yml"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "web/**"
      - "tooling/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owlfly-android-bundle-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android-bundle:
    name: Android debug smoke + manually signed AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.1.0"

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild OwlFly web assets
        run: npm run build

      - name: Run OwlFly tests
        run: npm test

      - name: Synchronize Capacitor Android
        run: npx cap sync android

      - name: Verify version and package before packaging
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'applicationId[[:space:]]+"com.owlfly.game"' android/app/build.gradle
          grep -Eq 'versionCode[[:space:]]+3([[:space:]]|$)' android/app/build.gradle
          grep -Eq 'targetSdkVersion[[:space:]]+36([[:space:]]|$)' android/app/build.gradle
          grep -Eq 'minSdkVersion[[:space:]]+24([[:space:]]|$)' android/app/build.gradle
          grep -Eq 'minSdkVersion[[:space:]]*=[[:space:]]*24([[:space:]]|$)' android/variables.gradle

      - name: Build debug APK for build verification
        working-directory: android
        run: bash ./gradlew --no-daemon :app:assembleDebug

      - name: Confirm packaged Android API level
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" > "$RUNNER_TEMP/owlfly-apk-badging.txt"
          grep -Eq "package: name='com.owlfly.game' versionCode='3' versionName='1.0.2'" "$RUNNER_TEMP/owlfly-apk-badging.txt"
          grep -Fxq "sdkVersion:'24'" "$RUNNER_TEMP/owlfly-apk-badging.txt"
          grep -Fxq "targetSdkVersion:'36'" "$RUNNER_TEMP/owlfly-apk-badging.txt"

      - name: Upload debug APK for physical smoke testing
        uses: actions/upload-artifact@v4
        with:
          name: owlfly-debug-apk-${{ github.run_id }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 3

      # Signing requires a manual dispatch from main; PRs never receive these secrets.
      - name: Decode existing Play upload keystore (manual build only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in UPLOAD_KEYSTORE_BASE64 STORE_PASS ALIAS KEY_PASS; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error::Missing required signing credential: $key"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/owlfly-upload.jks"
          test -s "$RUNNER_TEMP/owlfly-upload.jks"
          chmod 600 "$RUNNER_TEMP/owlfly-upload.jks"

      - name: Create signed Android App Bundle (manual build only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        working-directory: android
        env:
          OWLFLY_KEYSTORE_FILE: ${{ runner.temp }}/owlfly-upload.jks
          OWLFLY_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          OWLFLY_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          OWLFLY_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: bash ./gradlew --no-daemon :app:bundleRelease

      - name: Verify signed AAB (manual build only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        shell: bash
        run: |
          set -euo pipefail
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB"
          sha256sum "$AAB"

      - name: Downloadable signed AAB (manual build only)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: owlfly-closed-alpha-signed-aab-${{ github.run_id }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 3

      - name: Delete temporary upload keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/owlfly-upload.jks"
